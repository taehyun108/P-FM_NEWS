# P-FM NEWS 사내 소개 영상 (약 120초)
# 실행: node .claude/skills/demo-video/scripts/run_scenario.js \
#        --scenario docs/demo-videos/intro-120s.yaml
#
# 대상  : http://localhost:8000/ (로컬에서 backend/main.py 가 떠 있어야 한다)
# 목적  : 포스코그룹·정책·배터리 기사를 자동 수집·분석하고, 중요한 것은 텔레그램으로
#         알려주는 플랫폼이라는 것을 사내에 소개한다.
# 흐름  : 웹페이지 → 수집 기사 → 필터 → 텔레그램 연동 확인 → 발송 로그 → 대외협력 → 주간동향
#
# ── 셀렉터 메모 ──────────────────────────────────────────────────────
# 대부분 frontend/index.html 에 이미 있는 고정 id 를 그대로 썼다.
# "발송 로그" 통계 카드만 라벨 텍스트로만 구분되는 동적 버튼이라, 자동화가 텍스트에
# 기대지 않고 찾을 수 있도록 frontend/app.js 에 data-testid="stat-send-log" 를 새로 붙였다
# (다른 통계 카드에도 같은 방식으로 stat-total / stat-today / stat-notify-failed 등을 붙여 뒀다).
#
# ── 텔레그램 구간 관련 주의 ──────────────────────────────────────────
# 4번째 스텝은 실제 web.telegram.org 로 이동해 진짜 채널 내용을 보여준다. 이 러너는
# 매번 완전히 새 브라우저 컨텍스트(로그인 정보 없음)로 시작하기 때문에, 지금 상태로
# 그대로 돌리면 텔레그램 로그인(QR) 화면만 나온다. 실제로 로그인된 화면을 녹화하려면
# 러너에 storageState(로그인 세션 저장) 지원을 먼저 추가해야 한다 — 녹화 직전에 필요하면
# 바로 추가해 줄 수 있으니 그때 알려 달라. 지금은 시나리오 구조만 잡아 둔 상태다.
#
# ── 채팅용 10초 GIF ──────────────────────────────────────────────────
# mp4 렌더러(run_scenario.js)는 아직 GIF 출력을 만들지 않는다. 아래 "10초 GIF 후보 구간"
# 표시는 문서용 메모일 뿐 자동으로 처리되지 않는다. mp4가 나오면 그 구간의 정확한 초를
# 확인해서, ffmpeg-static 으로 짧게 잘라 GIF로 만드는 단계를 러너에 추가하겠다
# (팔레트 생성 방식으로 화질도 챙길 것 — 이것도 녹화 확인 후에 붙이면 된다).

title: "P-FM NEWS 사내 소개 (120초)"
baseUrl: "http://localhost:8000"
viewport: { width: 1920, height: 1080 }
output: "pfm-news-intro-120s"
timeout: 20000

steps:
  # ── 오프닝 카드 ─────────────────────────────────────────────────
  - chapter: "P-FM News Intelligence"
    subtitle: "포스코그룹·이차전지 뉴스를 자동으로 모으고, 중요한 것만 텔레그램으로 알려줍니다"
    duration: 3000

  # ── 챕터 1 : 웹 화면 — 수집 기사 · 필터 ──────────────────────────
  - chapter: "1. 실시간 기사 수집 · 필터"
    subtitle: "포스코그룹 · 정책 · 배터리 관련 기사를 자동으로 모으고 정리합니다"
    duration: 2500

  - goto: "/"

  - highlight: "#grid .card:first-of-type"
    caption: "포스코그룹·이차전지 관련 기사가 이렇게 자동으로 수집·요약됩니다"
    duration: 2600

  - highlight: "#filterBody"
    caption: "그룹사·카테고리·언론사·기간별로 원하는 기사만 골라볼 수 있습니다"
    duration: 2600

  - click: "#catChips button.chip:first-of-type"
    caption: "카테고리를 클릭하면 그 주제 기사만 바로 걸러집니다"

  - wait: 900

  - highlight: "#searchInput"
    caption: "키워드 검색으로 원하는 기사를 바로 찾을 수도 있습니다"
    duration: 2200

  # ── 챕터 2 : 텔레그램 연동 · 발송 로그 ────────────────────────────
  - chapter: "2. 텔레그램 실시간 알림"
    subtitle: "중요도가 높은 기사는 텔레그램으로 바로 전송됩니다"
    duration: 2500

  - caption: "실제 텔레그램 채널로 이동해서 확인해 보겠습니다"
  - wait: 800

  # ↓ 10초 GIF 후보 구간 시작 지점 — 텔레그램에 실제로 도착한 메시지를 보여주는 부분
  - goto: "https://web.telegram.org/a/#-1003978453669"

  - wait: 1800

  - caption: "기사 요약과 발송 이유가 담긴 메시지가 실시간으로 도착합니다"
  - wait: 2800
  # ↑ 10초 GIF 후보 구간 끝 지점 (실측 후 정확한 시작~10초 구간으로 잘라낼 예정)

  - goto: "/"

  - click: "[data-testid='stat-send-log']"
    caption: "웹 화면 하단의 '발송 로그'를 눌러보면"

  - wait: 400

  - highlight: "#detailModal .detail-modal"
    caption: "실제로 보낸 메시지와, 왜 보냈는지(발송 이유)까지 전부 확인할 수 있습니다"
    duration: 2800

  - wait: 1200

  - click: "#detailClose"

  # ── 챕터 3 : 대외협력 · 주간동향 ──────────────────────────────────
  - chapter: "3. 대외협력 · 주간동향"
    subtitle: "정책 · 통상 · 환경 이슈부터 한 주 종합 동향까지 챙깁니다"
    duration: 2500

  - click: "#eaTab"
    caption: "대외협력 탭에서는 정책·통상·환경 이슈를 모아서 보여줍니다"

  - wait: 1000

  - highlight: "#eaCatChips"
    caption: "입법·행정예고 / 국회 의안 / 통상 환경 / 부처별 동향 — 카테고리별로 구분됩니다"
    duration: 2600

  - highlight: "#eaList"
    caption: "마감이 임박한 순서로 주요 내용을 바로 확인할 수 있습니다"
    duration: 2600

  - click: "#weeklyTab"
    caption: "주간동향 탭에서는 한 주치 내용을 종합해서 보여줍니다"

  - wait: 1000

  - highlight: "#weeklyBody"
    caption: "그룹사별 · 정책별 한 주 동향을 한눈에 확인할 수 있습니다"
    duration: 2800

  - wait: 1000

  # ── 엔딩 카드 ───────────────────────────────────────────────────
  - clearCaption: true
  - chapter: "확인은 시스템이, 판단은 사람이"
    subtitle: "P-FM News Intelligence — 대외협력팀"
    duration: 3200
